<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>
        {% block title %}
            ShopSphere
        {% endblock %}
    </title>


    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        rel="stylesheet"
    >


    <style>

        .product-card {
            width: 100%;
            overflow: hidden;
            border-radius: 12px;
        }

        .product-image-wrapper {
            width: 100%;
            height: 240px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #ffffff;
        }

        .product-image {
            display: block;
            width: 100%;
            height: 100%;
            max-width: 100%;
            object-fit: contain;
        }

        .product-card .card-body {
            min-width: 0;
        }

        .product-card .card-title {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        @media (max-width: 575.98px) {
            .product-image-wrapper {
                height: 220px;
            }
        }

    </style>

</head>


<body>


    <!-- Navbar -->

    {% include "partials/navbar.html" %}


    <!-- Main Content -->

    <main class="main-content">

        <div class="container">

            {% if messages %}

                <div class="mb-4">

                    {% for message in messages %}

                        <div
                            class="alert
                            {% if message.tags %}
                                alert-{{ message.tags }}
                            {% else %}
                                alert-info
                            {% endif %}
                            alert-dismissible fade show"
                            role="alert"
                        >

                            {{ message }}

                            <button
                                type="button"
                                class="btn-close"
                                data-bs-dismiss="alert"
                                aria-label="Close"
                            ></button>

                        </div>

                    {% endfor %}

                </div>

            {% endif %}


            {% block content %}

            {% endblock %}

        </div>

    </main>


    <!-- Footer -->

    {% include "partials/footer.html" %}


    <!-- Bootstrap JavaScript -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    ></script>


    {% block extra_js %}
    {% endblock %}


</body>

</html>
