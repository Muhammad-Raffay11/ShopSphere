<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Create Account | ShopSphere</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        rel="stylesheet"
    >

    <style>

        body {
            min-height: 100vh;
            margin: 0;
            background:
                linear-gradient(
                    135deg,
                    #f8f9fa 0%,
                    #eef3f8 100%
                );

            font-family:
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 30px 15px;
        }


        .register-wrapper {
            width: 100%;
            max-width: 500px;
        }


        .register-card {
            background: #ffffff;

            border: none;

            border-radius: 18px;

            box-shadow:
                0 15px 40px rgba(0, 0, 0, 0.10);

            overflow: hidden;
        }


        .register-header {
            background:
                linear-gradient(
                    135deg,
                    #0d6efd,
                    #0b5ed7
                );

            color: white;

            padding: 30px 25px;

            text-align: center;
        }


        .register-icon {
            width: 70px;
            height: 70px;

            margin: 0 auto 15px;

            border-radius: 50%;

            background: rgba(255, 255, 255, 0.18);

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 32px;
        }


        .register-header h1 {
            font-size: 28px;

            font-weight: 700;

            margin-bottom: 6px;
        }


        .register-header p {
            margin: 0;

            opacity: 0.9;

            font-size: 14px;
        }


        .register-body {
            padding: 30px;
        }


        .form-label {
            font-weight: 600;

            color: #343a40;

            margin-bottom: 7px;
        }


        .form-control {
            min-height: 48px;

            border-radius: 10px;

            border: 1px solid #dee2e6;

            padding: 10px 13px;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease;
        }


        .form-control:focus {
            border-color: #0d6efd;

            box-shadow:
                0 0 0 0.2rem rgba(
                    13,
                    110,
                    253,
                    0.12
                );
        }


        .helptext {
            font-size: 12px;

            color: #6c757d;

            margin-top: 5px;
        }


        .errorlist {
            list-style: none;

            padding: 0;

            margin: 5px 0 0;

            color: #dc3545;

            font-size: 13px;
        }


        .register-button {
            width: 100%;

            min-height: 50px;

            border: none;

            border-radius: 10px;

            font-size: 16px;

            font-weight: 600;

            background: #0d6efd;

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }


        .register-button:hover {
            background: #0b5ed7;

            transform: translateY(-1px);

            box-shadow:
                0 6px 15px rgba(
                    13,
                    110,
                    253,
                    0.25
                );
        }


        .login-section {
            text-align: center;

            margin-top: 22px;

            padding-top: 20px;

            border-top: 1px solid #eeeeee;

            color: #6c757d;

            font-size: 14px;
        }


        .login-section a {
            color: #0d6efd;

            font-weight: 600;

            text-decoration: none;
        }


        .login-section a:hover {
            text-decoration: underline;
        }


        .brand {
            text-align: center;

            margin-bottom: 18px;

            color: #212529;

            font-size: 18px;

            font-weight: 700;
        }


        .brand i {
            color: #0d6efd;

            margin-right: 6px;
        }


        /* Mobile */

        @media (max-width: 575.98px) {

            body {
                padding: 20px 12px;
            }


            .register-header {
                padding: 25px 20px;
            }


            .register-header h1 {
                font-size: 24px;
            }


            .register-body {
                padding: 24px 20px;
            }


            .register-icon {
                width: 60px;
                height: 60px;

                font-size: 27px;
            }

        }

    </style>

</head>


<body>


    <div class="register-wrapper">


        <!-- Brand -->

        <div class="brand">

            <i class="bi bi-shop"></i>

            ShopSphere

        </div>


        <!-- Register Card -->

        <div class="register-card">


            <!-- Header -->

            <div class="register-header">

                <div class="register-icon">

                    <i class="bi bi-person-plus"></i>

                </div>


                <h1>
                    Create Your Account
                </h1>


                <p>
                    Join ShopSphere and start shopping today
                </p>

            </div>


            <!-- Body -->

            <div class="register-body">


                <form
                    method="post"
                    novalidate
                >

                    {% csrf_token %}


                    {{ form.as_p }}


                    <button
                        type="submit"
                        class="btn btn-primary register-button mt-2"
                    >

                        <i class="bi bi-person-plus me-2"></i>

                        Create Account

                    </button>


                </form>


                <!-- Login -->

                <div class="login-section">

                    Already have an account?

                    <a href="{% url 'accounts:login' %}">
                        Login
                    </a>

                </div>


            </div>


        </div>


    </div>


</body>

</html>
